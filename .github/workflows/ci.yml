name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: linux-x86_64
            os: ubuntu-24.04
            classifier: linux-x86_64
          - label: osx-aarch64
            os: macos-15
            classifier: osx-aarch64
          - label: windows-x86_64
            os: windows-2025
            classifier: windows-x86_64
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out plugin
        uses: actions/checkout@v5

      - name: Check out pdal-java-bindings
        uses: actions/checkout@v5
        with:
          repository: edigonzales/pdal-java-bindings
          path: .ci/pdal-java-bindings

      - name: Check out hop-pointcloud-type-plugin
        uses: actions/checkout@v5
        with:
          repository: edigonzales/hop-pointcloud-type-plugin
          path: .ci/hop-pointcloud-type-plugin

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install conda-package-handling
        shell: bash
        run: |
          python -m pip install --user conda-package-handling
          USER_BASE="$(python -m site --user-base)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "$USER_BASE/Scripts" >> "$GITHUB_PATH"
          else
            echo "$USER_BASE/bin" >> "$GITHUB_PATH"
          fi

      - name: Install patchelf (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf

      - name: Stage PDAL natives and publish to the local Maven repository
        shell: bash
        working-directory: .ci/pdal-java-bindings
        run: |
          chmod +x ./gradlew tools/natives/*.sh tools/ffi/*.sh
          tools/natives/fetch-and-stage.sh ${{ matrix.classifier }}
          tools/natives/audit-runtime-deps.sh ${{ matrix.classifier }}
          ./gradlew publishToMavenLocal

      - name: Install Point Cloud Type plugin
        shell: bash
        working-directory: .ci/hop-pointcloud-type-plugin
        run: mvn -B -ntp install

      - name: Build and test PDAL plugin
        shell: bash
        env:
          PDAL_RUN_INTEGRATION: 'true'
        run: mvn -B -ntp clean verify

      - name: Verify plugin package
        shell: bash
        run: |
          python scripts/verify-package.py
          python scripts/stage-artifacts.py

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v6
        with:
          name: hop-pdal-plugin-${{ matrix.label }}
          path: assemblies/assemblies-hop-pdal/target/hop-pdal-plugin-*.zip
